name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.planning/**'
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke check live page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${PAGE_URL}?cb=${GITHUB_RUN_ID}" | grep -q '/pilgrims-predestined-path/assets/index-'; then
              echo "live page references built assets"; exit 0
            fi
            sleep 10
          done
          echo "live page does not reference built assets"; exit 1
      - name: Smoke check live PWA files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          BASE_URL="${PAGE_URL%/}/"
          for f in manifest.webmanifest sw.js pwa-192x192.png pwa-512x512.png maskable-icon-512x512.png apple-touch-icon-180x180.png; do
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null "${BASE_URL}${f}?cb=${GITHUB_RUN_ID}"; then
                ok=1; break
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "live file missing: ${f}"; exit 1
            fi
            echo "live file ok: ${f}"
          done
